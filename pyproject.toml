[project]
name = "care-team"
version = "0.1.0"
description = "AI care-team platform: an Architect builds a Fleet of agents that runs care calls with humans in the loop."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.150.0",
    "google-genai>=2.31.0",
    "pydantic-ai>=2.57.0",
    "pypdf>=6.21.1",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
# tools/ holds standalone python3 helper scripts (Person B), not app code.
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "httpx>=0.28.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
