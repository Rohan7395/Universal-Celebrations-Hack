name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Unit + API tests (LLM mocked)
        run: uv run pytest --ignore=tests/safety -q

      - name: Dependency audit (pip-audit)
        run: uv run pip-audit

      - name: Security lint (bandit)
        run: uv run bandit -r app -q -ll
